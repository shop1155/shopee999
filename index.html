<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🛍️ 雙寶蝦皮專屬轉換器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: #f6f7f9;
      color: #222;
      margin: 0;
      padding: 24px 16px;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      background: #fff;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }
    h1 {
      font-size: 1.45rem;
      margin: 0;
    }
    .toggle-settings-btn {
      background: #f1f3f5;
      color: #444;
      border: 1px solid #d8dee4;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .toggle-settings-btn:hover {
      background: #e5e9ed;
    }
    .subtitle {
      color: #666;
      font-size: 0.92rem;
      margin: 0 0 20px;
    }
    .settings-box {
      background: #f8f9fb;
      border: 1px solid #e3e7ed;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 18px;
      display: none; /* 預設隱藏設定框 */
    }
    .settings-box.show {
      display: block;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 600px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
    label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cfd6df;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
    }
    textarea {
      min-height: 110px;
      resize: vertical;
    }
    .btn-primary {
      margin-top: 12px;
      width: 100%;
      padding: 12px 16px;
      background: #ee4d2d;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary:hover {
      background: #d73f22;
    }
    .result-item {
      border: 1px solid #e5e8ec;
      background: #fafbfc;
      border-radius: 10px;
      padding: 14px;
      margin-top: 14px;
    }
    .result-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }
    .badge {
      background: #e6f7ed;
      color: #137333;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .result-url {
      word-break: break-all;
      font-size: 0.9rem;
      background: #fff;
      border: 1px dashed #cbd3dd;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .btn-copy {
      background: #1f2937;
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 7px 12px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-copy:hover {
      background: #111827;
    }
    .error-text {
      color: #c62828;
      font-size: 0.9rem;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-row">
      <h1>🛍️ 雙寶蝦皮專屬轉換器</h1>
      <button type="button" class="toggle-settings-btn" id="toggleSettingsBtn" onclick="toggleSettings()">
        ⚙️ 參數設定
      </button>
    </div>
    <p class="subtitle">貼上蝦皮商品網址，一鍵產生附帶分潤追蹤的專屬連結。</p>

    <div class="settings-box" id="settingsBox">
      <div class="grid-2">
        <div>
          <label for="affId">分潤帳號 ID (utm_source)</label>
          <input type="text" id="affId" value="an_16302200032" />
        </div>
        <div>
          <label for="subId">追蹤標籤 Sub ID (utm_content)</label>
          <input type="text" id="subId" value="iruby" />
        </div>
      </div>
    </div>

    <label for="rawLinks">貼上蝦皮商品網址（支援多筆，一行一個）</label>
    <textarea id="rawLinks" placeholder="例如：https://shopee.tw/product/123456/789012"></textarea>

    <button type="button" class="btn-primary" onclick="convertLinks()">🚀 立即轉換連結</button>
    <div id="errorMsg" class="error-text"></div>
    <div id="results"></div>
  </div>

  <script>
    function toggleSettings() {
      const box = document.getElementById("settingsBox");
      box.classList.toggle("show");
    }

    function extractFirstUrl(text) {
      const match = text.match(/https?:\/\/[^\s]+/i);
      return match ? match[0] : "";
    }

    function convertLinks() {
      const rawText = document.getElementById("rawLinks").value.trim();
      const affId = document.getElementById("affId").value.trim() || "an_16302200032";
      const subId = document.getElementById("subId").value.trim() || "iruby";
      const errorEl = document.getElementById("errorMsg");
      const resultsEl = document.getElementById("results");

      errorEl.textContent = "";
      resultsEl.innerHTML = "";

      if (!rawText) {
        errorEl.textContent = "請先貼上至少一個蝦皮商品網址。";
        return;
      }

      const lines = rawText.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      let successCount = 0;

      lines.forEach((line, idx) => {
        const cleanUrl = extractFirstUrl(line);
        if (!cleanUrl) return;

        try {
          const urlObj = new URL(cleanUrl);
          urlObj.searchParams.set("utm_source", affId);
          urlObj.searchParams.set("utm_medium", "affiliates");
          urlObj.searchParams.set("utm_campaign", "-");
          urlObj.searchParams.set("utm_content", subId);

          successCount += 1;
          const finalUrl = urlObj.toString();
          const card = document.createElement("div");
          card.className = "result-item";
          card.innerHTML = `
            <div class="result-top">
              <span class="badge">✅ 轉換成功 #${successCount}</span>
              <button type="button" class="btn-copy" onclick="copyText(this, ${JSON.stringify(finalUrl)})">複製連結</button>
            </div>
            <div class="result-url">${finalUrl}</div>
          `;
          resultsEl.appendChild(card);
        } catch (err) {
          errorEl.textContent = `第 ${idx + 1} 行網址格式無法辨識，請確認是否為完整 http/https 網址。`;
        }
      });

      if (successCount === 0 && !errorEl.textContent) {
        errorEl.textContent = "找不到有效的網址，請確認貼上的內容包含 http:// 或 https://。";
      }
    }

    function copyText(btn, text) {
      navigator.clipboard.writeText(text).then(() => {
        const oldText = btn.textContent;
        btn.textContent = "已複製！";
        setTimeout(() => { btn.textContent = oldText; }, 1500);
      });
    }
  </script>
</body>
</html>
